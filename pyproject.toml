[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-omics"
version = "0.2.0"
description = "Unpaired privileged (omics / CT-clinical) transfer for COPD respiratory-audio classification"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "torch>=2.4",
]

[project.optional-dependencies]
audio = [
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.15",
  "torchaudio>=2.4",
]
text = ["transformers>=4.49,<6"]
figures = ["matplotlib>=3.8"]
tuning = ["optuna>=4,<5"]
dev = ["pytest>=8", "ruff>=0.5"]

# The package is a flat collection of scripts run from inside voice_omics/
# (e.g. `bash voice_omics/scripts/run_all.sh`), not an importable library.
# `pip install -e .` therefore installs dependencies only.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 110
target-version = "py311"
